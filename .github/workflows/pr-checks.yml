name: Labeling PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: labeling-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tests:
    name: Labeling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: labeling/label-studio-src
    env:
      DJANGO_DB: sqlite
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check Python syntax in app, converters and SAM
        run: python -m compileall -q label_studio ../converters ../sam_backend
      - name: Install locked test dependencies
        run: |
          python -m pip install poetry==2.3.2
          poetry install --no-root --only main,test
      - name: Run backend tests with SQLite
        env:
          LABEL_STUDIO_BASE_DATA_DIR: ${{ runner.temp }}/labeling-pr-data
        working-directory: labeling/label-studio-src/label_studio
        run: |
          poetry run python -m pytest -m 'not integration_tests' \
            tests/test_project_validation.py \
            tests/test_annotations_result_count.py \
            tests/test_predictions.py \
            tests/feature_checks
